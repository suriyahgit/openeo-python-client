# GitLab CI for the DEDL openeo-python-client fork.
# Ported from the GitHub Actions workflows (lint, unittests, build-wheel, sphinx docs).

stages:
  - lint
  - test
  - build
  - publish
  - pages

variables:
  PIP_CACHE_DIR: "${CI_PROJECT_DIR}/.cache/pip"

workflow:
  rules:
    # Run on merge request events
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # Run on tag pushes (for publishing)
    - if: $CI_COMMIT_TAG
    # Skip branch pipelines when an MR is already open (avoid duplicates)
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    # Run on plain branch pushes
    - if: $CI_COMMIT_BRANCH

default:
  image: python:3.12
  tags:
    - csm-docker
  cache:
    key: "${CI_COMMIT_REF_SLUG}"
    paths:
      - .cache/pip

lint:
  stage: lint
  script:
    - python -m pip install --upgrade pip
    - python -m pip install flake8
    # stop the build if there are Python syntax errors or undefined names
    - flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
    # exit-zero treats all errors as warnings
    - flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

test:
  stage: test
  image: "python:${PYTHON_VERSION}"
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
  script:
    - python -m pip install --upgrade pip
    - python -m pip install -e ".[tests]"
    - python -m pytest -v

build-wheel:
  stage: build
  script:
    - python -m pip install --upgrade pip
    - python -m pip install build
    - python -m build
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

publish-package:
  stage: publish
  dependencies:
    - build-wheel
  variables:
    PACKAGE_REGISTRY_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi"
  script:
    - python -m pip install --upgrade pip
    - python -m pip install twine
    - python -m twine upload --repository-url "${PACKAGE_REGISTRY_URL}" -u gitlab-ci-token -p "${CI_JOB_TOKEN}" dist/*
  rules:
    - if: $CI_COMMIT_TAG

pages:
  stage: pages
  script:
    - python -m pip install --upgrade pip
    - python -m pip install ".[docs]"
    - python -m sphinx -b html docs public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
